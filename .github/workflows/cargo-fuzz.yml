name: Cargo Fuzz

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "45 2 * * 4"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz web application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install nightly Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Fuzz web application
        run: cargo fuzz run web_app --fuzz-dir fuzz -- -max_total_time=30

      - name: Upload fuzz crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: fuzz/artifacts/web_app/
          if-no-files-found: ignore
