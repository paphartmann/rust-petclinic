name: OWASP ZAP

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 2 * * 4"

permissions:
  contents: read

jobs:
  zap:
    name: ZAP full application scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Build API
        working-directory: server
        run: cargo build --locked

      - name: Start API
        working-directory: server
        run: |
          ./target/debug/rust-petclinic > /tmp/rust-petclinic.log 2>&1 &
          echo $! > /tmp/rust-petclinic.pid

      - name: Wait for API
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --location http://127.0.0.1:3000/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/rust-petclinic.log
          exit 1

      - name: Run OWASP ZAP full scan
        uses: zaproxy/action-full-scan@v0.13.0
        with:
          target: http://localhost:3000/
          allow_issue_writing: false
          fail_action: false

      - name: Run OWASP ZAP API scan
        uses: zaproxy/action-api-scan@v0.10.0
        with:
          target: .zap/openapi.yaml
          format: openapi
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap_api_scan
