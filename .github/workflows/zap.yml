name: OWASP ZAP

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 2 * * 4"

permissions:
  contents: read

jobs:
  zap:
    name: ZAP baseline scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Start API
        working-directory: server
        run: |
          cargo run > /tmp/rust-petclinic.log 2>&1 &
          echo $! > /tmp/rust-petclinic.pid

      - name: Wait for API
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/owners >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/rust-petclinic.log
          exit 1

      - name: Run OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@latest
        with:
          target: http://localhost:3000/owners
          allow_issue_writing: false
