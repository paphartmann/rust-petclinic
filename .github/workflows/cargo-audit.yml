name: Cargo Audit

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "15 2 * * 4"

permissions:
  contents: read

jobs:
  audit:
    name: Audit Rust dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit all Rust lockfiles
        run: |
          status=0
          for lockfile in server/Cargo.lock client/Cargo.lock dto/Cargo.lock; do
            cargo audit --file "$lockfile" || status=1
          done
          exit "$status"
